security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_employe_provider:
            entity:
                class: App\Entity\Employe
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api_login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_employe_provider
            jwt: ~

        main:
            lazy: true
            provider: app_employe_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                default_target_path: app_home
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/api/login,      roles: PUBLIC_ACCESS }
        - { path: ^/api,            roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/login,          roles: PUBLIC_ACCESS }
        # Employés, étages, chambres, rôles : admin seulement
        - { path: ^/employes,       roles: ROLE_ADMINISTRATEUR }
        - { path: ^/etages,         roles: ROLE_ADMINISTRATEUR }
        - { path: ^/chambres,       roles: ROLE_ADMINISTRATEUR }
        - { path: ^/roles,          roles: ROLE_ADMINISTRATEUR }
        # Paramètres : admin seulement
        - { path: ^/parametres,     roles: ROLE_ADMINISTRATEUR }
        # Patients et réservations : tout employé connecté
        - { path: ^/patients,       roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/reservations,   roles: IS_AUTHENTICATED_FULLY }
        # Profil : tout employé connecté
        - { path: ^/profil,         roles: IS_AUTHENTICATED_FULLY }
        # / est public (landing/dashboard selon état connexion)

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
